AWSTemplateFormatVersion: 2010-09-09
Description: >-
  NexGen Speak - Backend Service

Transform:
  - AWS::Serverless-2016-10-31

# ====================================================================
#                     PARAMETERS
# ====================================================================
Parameters:
  EnvironmentCode:
    Type: String
    Description: "Environment code"
    AllowedPattern: ".+"
    AllowedValues:
      - "dev"
      - "uat"
      - "prod"

  CountryCode:
    Type: String
    Description: "Country code"
    AllowedPattern: ".+"
    AllowedValues:
      - "vn"

  AppName:
    Type: String
    Description: "Name of application"
    AllowedPattern: ".+"

  AwsRegion:
    Type: String
    Description: "AWS Region"
    AllowedPattern: ".+"

  # Authentication Configuration (from dev.env)
  JwtSecret:
    Type: String
    Description: "JWT signing secret"
    NoEcho: true

  EmailFrom:
    Type: String
    Description: "Sender email address for SES (must be verified in SES)"

  OtpExpiredMinutes:
    Type: Number
    Description: "OTP expiration time in minutes"
    Default: 5

Conditions:
  ConditionUseDev: !Equals
    - !Ref EnvironmentCode
    - dev
  ConditionUseProd: !Equals
    - !Ref EnvironmentCode
    - prod

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 600
    MemorySize: 256
    Tracing: Active
    Environment:
      Variables:
        AWS: True
        ENV: !Ref EnvironmentCode
        COUNTRY_CODE: !Ref CountryCode
        APP_NAME: !Ref AppName
        APP_REGION: !Ref AwsRegion

Resources:
  # ========================== API GATEWAY ================================
  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      Name:
        !Join [
          "-",
          [!Ref EnvironmentCode, !Ref AppName, "api", !Ref CountryCode],
        ]
      StageName: !Ref EnvironmentCode
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'*'"
      DefinitionBody:
        openapi: "3.0.1"
        info:
          title:
            !Join [
              "-",
              [!Ref EnvironmentCode, !Ref AppName, "api", !Ref CountryCode],
            ]
          version: "1.0"
        paths:
          /login:
            post:
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthLoginLambda.Arn}/invocations"
          /register:
            post:
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthRegisterLambda.Arn}/invocations"
          /verify-otp:
            post:
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthVerifyOtpLambda.Arn}/invocations"
          /social-auth:
            post:
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthSocialAuthLambda.Arn}/invocations"
          /forgot-password:
            post:
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthForgotPasswordLambda.Arn}/invocations"

  # ========================== POLICIES ================================
  FunctionsLogPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName:
        !Join ["-", [!Ref EnvironmentCode, !Ref AppName, "access-logs"]]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: "arn:aws:logs:*:*:*"
      Roles:
        - !Ref AuthLoginRole
        - !Ref AuthRegisterRole
        - !Ref AuthVerifyOtpRole
        - !Ref AuthForgotPasswordRole

  AuthLoginPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName:
        !Join [
          "-",
          [
            !Ref EnvironmentCode,
            !Ref AppName,
            "auth-login",
            !Ref CountryCode,
            "policy",
          ],
        ]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowDDBQuery
            Effect: Allow
            Action:
              - dynamodb:Query
            Resource:
              - !GetAtt AuthUserTable.Arn
              - !Sub "${AuthUserTable.Arn}/index/emailIndex"
      Roles:
        - !Ref AuthLoginRole

  AuthRegisterPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName:
        !Join [
          "-",
          [
            !Ref EnvironmentCode,
            !Ref AppName,
            "auth-register",
            !Ref CountryCode,
            "policy",
          ],
        ]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowDDBPut
            Effect: Allow
            Action:
              - dynamodb:PutItem
              - dynamodb:Query
            Resource:
              - !GetAtt AuthUserTable.Arn
              - !Sub "${AuthUserTable.Arn}/index/emailIndex"
          - Sid: AllowSESSendEmail
            Effect: Allow
            Action:
              - ses:SendEmail
              - ses:SendRawEmail
            Resource: "*"
          - Sid: AllowSNSPublish
            Effect: Allow
            Action:
              - sns:Publish
            Resource:
              - !Ref OTPNotificationTopic
      Roles:
        - !Ref AuthRegisterRole

  AuthSocialAuthPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName:
        !Join [
          "-",
          [
            !Ref EnvironmentCode,
            !Ref AppName,
            "auth-social-auth",
            !Ref CountryCode,
            "policy",
          ],
        ]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowDDBQuery
            Effect: Allow
            Action:
              - dynamodb:Query
            Resource:
              - !GetAtt AuthUserTable.Arn
              - !Sub "${AuthUserTable.Arn}/index/emailIndex"
      Roles:
        - !Ref AuthLoginRole

  AuthVerifyOtpPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName:
        !Join [
          "-",
          [
            !Ref EnvironmentCode,
            !Ref AppName,
            "auth-verify-otp",
            !Ref CountryCode,
            "policy",
          ],
        ]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowDDBQueryUpdate
            Effect: Allow
            Action:
              - dynamodb:Query
              - dynamodb:UpdateItem
            Resource:
              - !GetAtt AuthUserTable.Arn
              - !Sub "${AuthUserTable.Arn}/index/emailIndex"
      Roles:
        - !Ref AuthVerifyOtpRole

  AuthForgotPasswordPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName:
        !Join [
          "-",
          [
            !Ref EnvironmentCode,
            !Ref AppName,
            "auth-forgot-password",
            !Ref CountryCode,
            "policy",
          ],
        ]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowDDBQueryUpdate
            Effect: Allow
            Action:
              - dynamodb:Query
              - dynamodb:UpdateItem
            Resource:
              - !GetAtt AuthUserTable.Arn
              - !Sub "${AuthUserTable.Arn}/index/emailIndex"
      Roles:
        - !Ref AuthForgotPasswordRole

  # ========================== ROLES ================================
  AuthLoginRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        !Join [
          "-",
          [
            !Ref EnvironmentCode,
            !Ref AppName,
            "auth-login",
            !Ref CountryCode,
            "role",
          ],
        ]
      Description: Role for Auth Login Lambda
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action: sts:AssumeRole
      MaxSessionDuration: 3600
      Path: /

  AuthRegisterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        !Join [
          "-",
          [
            !Ref EnvironmentCode,
            !Ref AppName,
            "auth-register",
            !Ref CountryCode,
            "role",
          ],
        ]
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: [lambda.amazonaws.com]
            Action: sts:AssumeRole
      Path: /

  AuthVerifyOtpRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        !Join [
          "-",
          [
            !Ref EnvironmentCode,
            !Ref AppName,
            "auth-verify-otp",
            !Ref CountryCode,
            "role",
          ],
        ]
      Description: Role for Auth Verify OTP Lambda
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action: sts:AssumeRole
      MaxSessionDuration: 3600
      Path: /

  AuthForgotPasswordRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        !Join [
          "-",
          [
            !Ref EnvironmentCode,
            !Ref AppName,
            "auth-forgot-password",
            !Ref CountryCode,
            "role",
          ],
        ]
      Description: Role for Auth Forgot Password Lambda
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action: sts:AssumeRole
      MaxSessionDuration: 3600
      Path: /

  # ========================== Lambda Layers ================================
  SharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName:
        !Join [
          "-",
          [
            !Ref EnvironmentCode,
            !Ref AppName,
            "shared-layer",
            !Ref CountryCode,
          ],
        ]
      Description: Dependencies for NexgenSpeak Backend Service.
      ContentUri: ../src/layers/
      CompatibleRuntimes: ["nodejs20.x"]
      LicenseInfo: "MIT"
      RetentionPolicy: Retain
  # ========================== LAMBDA =======================================
  AuthLoginLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        !Join [
          "-",
          [!Ref EnvironmentCode, !Ref AppName, "auth-login", !Ref CountryCode],
        ]
      CodeUri: ../src/lambdas/auth/login
      Role: !GetAtt AuthLoginRole.Arn
      Handler: app.lambdaHandler
      MemorySize: 256
      Timeout: 600
      Runtime: nodejs20.x
      Tracing: Active
      Layers:
        - !Ref SharedLayer
      Environment:
        Variables:
          AWS: True
          JWT_SECRET: !Ref JwtSecret
          USERS_TABLE: !Ref AuthUserTable
          EMAIL_INDEX: emailIndex

  AuthRegisterLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        !Join [
          "-",
          [
            !Ref EnvironmentCode,
            !Ref AppName,
            "auth-register",
            !Ref CountryCode,
          ],
        ]
      CodeUri: ../src/lambdas/auth/register
      Handler: app.lambdaHandler
      Runtime: nodejs20.x
      MemorySize: 256
      Timeout: 600
      Tracing: Active
      Role: !GetAtt AuthRegisterRole.Arn
      Layers:
        - !Ref SharedLayer
      Environment:
        Variables:
          AWS: True
          JWT_SECRET: !Ref JwtSecret
          USERS_TABLE: !Ref AuthUserTable
          EMAIL_INDEX: emailIndex
          EMAIL_FROM: !Ref EmailFrom
          OTP_EXPIRED_MINUTES: !Ref OtpExpiredMinutes
          OTP_NOTIFICATION_TOPIC_ARN: !Ref OTPNotificationTopic

  AuthSocialAuthLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        !Join [
          "-",
          [
            !Ref EnvironmentCode,
            !Ref AppName,
            "auth-social-auth",
            !Ref CountryCode,
          ],
        ]
      CodeUri: ../src/lambdas/auth/social-auth
      Handler: app.lambdaHandler
      Role: !GetAtt AuthLoginRole.Arn
      Layers:
        - !Ref SharedLayer
      Environment:
        Variables:
          AWS: True
          JWT_SECRET: !Ref JwtSecret
          USERS_TABLE: !Ref AuthUserTable
          EMAIL_INDEX: emailIndex

  AuthVerifyOtpLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        !Join [
          "-",
          [
            !Ref EnvironmentCode,
            !Ref AppName,
            "auth-verify-otp",
            !Ref CountryCode,
          ],
        ]
      CodeUri: ../src/lambdas/auth/verify-otp
      Handler: app.lambdaHandler
      Runtime: nodejs20.x
      MemorySize: 256
      Timeout: 600
      Tracing: Active
      Role: !GetAtt AuthVerifyOtpRole.Arn
      Layers:
        - !Ref SharedLayer
      Environment:
        Variables:
          AWS: True
          USERS_TABLE: !Ref AuthUserTable
          EMAIL_INDEX: emailIndex

  AuthForgotPasswordLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        !Join [
          "-",
          [
            !Ref EnvironmentCode,
            !Ref AppName,
            "auth-forgot-password",
            !Ref CountryCode,
          ],
        ]
      CodeUri: ../src/lambdas/auth/forgot-password
      Handler: app.lambdaHandler
      Runtime: nodejs20.x
      MemorySize: 256
      Timeout: 600
      Tracing: Active
      Role: !GetAtt AuthForgotPasswordRole.Arn
      Layers:
        - !Ref SharedLayer
      Environment:
        Variables:
          AWS: True
          USERS_TABLE: !Ref AuthUserTable
          EMAIL_INDEX: emailIndex
  # ========================== SNS NOTIFICATIONS ================================
  OTPNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName:
        !Join [
          "-",
          [
            !Ref EnvironmentCode,
            !Ref AppName,
            "otp-notifications",
            !Ref CountryCode,
          ],
        ]
      DisplayName: "OTP Email Notifications"

  # ========================== LAMBDA PERMISSIONS ================================
  AuthLoginLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AuthLoginLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGateway}/*/*"

  AuthRegisterLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AuthRegisterLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGateway}/*/*"

  AuthSocialAuthLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AuthSocialAuthLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGateway}/*/*"

  AuthVerifyOtpLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AuthVerifyOtpLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGateway}/*/*"

  AuthForgotPasswordLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AuthForgotPasswordLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGateway}/*/*"

  # ========================== DynamoDB =====================================
  AuthUserTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:
        !Join ["-", [!Ref AWS::StackName, "auth-user", !Ref CountryCode]]
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: !If [ConditionUseProd, true, false]
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: emailIndex
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL

Outputs:
  # ========================== API GATEWAY OUTPUTS ================================
  ApiGatewayUrl:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${EnvironmentCode}"
    Export:
      Name: !Sub "${AWS::StackName}-ApiGatewayUrl"

  ApiGatewayId:
    Description: "API Gateway ID"
    Value: !Ref ApiGateway
    Export:
      Name: !Sub "${AWS::StackName}-ApiGatewayId"

  # ========================== LAMBDA OUTPUTS ================================
  AuthLoginLambdaArn:
    Description: "Auth Login Lambda ARN"
    Value: !GetAtt AuthLoginLambda.Arn
    Export:
      Name: !Sub "${AWS::StackName}-AuthLoginLambdaArn"

  AuthRegisterLambdaArn:
    Description: "Auth Register Lambda ARN"
    Value: !GetAtt AuthRegisterLambda.Arn
    Export:
      Name: !Sub "${AWS::StackName}-AuthRegisterLambdaArn"

  AuthSocialAuthLambdaArn:
    Description: "Auth Social Auth Lambda ARN"
    Value: !GetAtt AuthSocialAuthLambda.Arn
    Export:
      Name: !Sub "${AWS::StackName}-AuthSocialAuthLambdaArn"

  AuthVerifyOtpLambdaArn:
    Description: "Auth Verify OTP Lambda ARN"
    Value: !GetAtt AuthVerifyOtpLambda.Arn
    Export:
      Name: !Sub "${AWS::StackName}-AuthVerifyOtpLambdaArn"

  AuthForgotPasswordLambdaArn:
    Description: "Auth Forgot Password Lambda ARN"
    Value: !GetAtt AuthForgotPasswordLambda.Arn
    Export:
      Name: !Sub "${AWS::StackName}-AuthForgotPasswordLambdaArn"

  # ========================== DYNAMODB OUTPUTS ================================
  AuthUserTableName:
    Description: "Auth User Table Name"
    Value: !Ref AuthUserTable
    Export:
      Name: !Sub "${AWS::StackName}-AuthUserTableName"

  # ========================== SNS OUTPUTS ================================
  OTPNotificationTopicArn:
    Description: "OTP Notification Topic ARN"
    Value: !Ref OTPNotificationTopic
    Export:
      Name: !Sub "${AWS::StackName}-OTPNotificationTopicArn"
