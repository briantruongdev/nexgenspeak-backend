AWSTemplateFormatVersion: 2010-09-09
Description: >-
  NexGen Speak - Backend Service

Transform:
  - AWS::Serverless-2016-10-31

# ====================================================================
#                     PARAMETERS
# ====================================================================
Parameters:
  EnvironmentCode:
    Type: String
    Description: "Environment code"
    AllowedPattern: ".+"
    AllowedValues:
      - "dev"
      - "uat"
      - "prod"
    Default: "dev"

  CountryCode:
    Type: String
    Description: "Country code"
    AllowedPattern: ".+"
    AllowedValues:
      - "vn"
    Default: "vn"

  AppName:
    Type: String
    Description: "Name of application"
    Default: "nexgenspeak-backend-services"
    AllowedPattern: ".+"

  AwsRegion:
    Type: String
    Description: "AWS Region"
    Default: "ap-southeast-1"
    AllowedPattern: ".+"
    AllowedValues:
      - "ap-southeast-1"
      - "ap-southeast-2"
      - "ap-northeast-1"

  JwtSecret:
    Type: String
    Description: "JWT signing secret"
    NoEcho: true

Conditions:
  ConditionUseDev: !Equals
    - !Ref EnvironmentCode
    - dev
  ConditionUseProd: !Equals
    - !Ref EnvironmentCode
    - prod

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 600
    MemorySize: 256
    Tracing: Active
    Environment:
      Variables:
        AWS: True
        ENV: !Ref EnvironmentCode
        COUNTRY_CODE: !Ref CountryCode
        APP_NAME: !Ref AppName
        APP_REGION: !Ref AwsRegion

Resources:
  # ========================== API GATEWAY ================================
  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      Name:
        !Join [
          "-",
          [!Ref EnvironmentCode, !Ref AppName, "api", !Ref CountryCode],
        ]
      StageName: !Ref EnvironmentCode
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'*'"
      DefinitionBody:
        openapi: "3.0.1"
        info:
          title:
            !Join [
              "-",
              [!Ref EnvironmentCode, !Ref AppName, "api", !Ref CountryCode],
            ]
          version: "1.0"
        paths:
          /login:
            post:
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthLoginLambda.Arn}/invocations"
          /register:
            post:
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthRegisterLambda.Arn}/invocations"
          /social-auth:
            post:
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthSocialAuthLambda.Arn}/invocations"
          /forgot-password:
            post:
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthForgotPasswordLambda.Arn}/invocations"
          /trial-requests:
            post:
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TrialRequestsLambda.Arn}/invocations"
          /teachers:
            get:
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetTeachersLambda.Arn}/invocations"
          /teachers/{teacherId}:
            get:
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetTeacherByIdLambda.Arn}/invocations"
          /teachers/{teacherId}/available-slots:
            get:
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetAvailableSlotsLambda.Arn}/invocations"
          /teachers/favorite:
            post:
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ToggleFavoriteLambda.Arn}/invocations"
          /teachers/favorites:
            get:
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetFavoritesLambda.Arn}/invocations"
          /registrations:
            get:
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetRegistrationsLambda.Arn}/invocations"
            post:
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CreateRegistrationLambda.Arn}/invocations"
          /registrations/cancel-slot:
            delete:
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CancelSlotLambda.Arn}/invocations"

  # ========================== POLICIES ================================
  FunctionsLogPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName:
        !Join ["-", [!Ref EnvironmentCode, !Ref AppName, "access-logs"]]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: "arn:aws:logs:*:*:*"
      Roles:
        - !Ref AuthLoginRole
        - !Ref AuthRegisterRole
        - !Ref AuthSocialAuthRole
        - !Ref AuthForgotPasswordRole
        - !Ref GetTeachersRole
        - !Ref GetTeacherByIdRole
        - !Ref GetAvailableSlotsRole
        - !Ref CreateRegistrationRole
        - !Ref GetRegistrationsRole
        - !Ref CancelSlotRole
        - !Ref ToggleFavoriteRole
        - !Ref GetFavoritesRole

  AuthLoginPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName:
        !Join [
          "-",
          [
            !Ref EnvironmentCode,
            !Ref AppName,
            "auth-login",
            !Ref CountryCode,
            "policy",
          ],
        ]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowDDBQuery
            Effect: Allow
            Action:
              - dynamodb:Query
            Resource:
              - !GetAtt AuthUserTable.Arn
              - !Sub "${AuthUserTable.Arn}/index/emailIndex"
      Roles:
        - !Ref AuthLoginRole

  AuthRegisterPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName:
        !Join [
          "-",
          [
            !Ref EnvironmentCode,
            !Ref AppName,
            "auth-register",
            !Ref CountryCode,
            "policy",
          ],
        ]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowDDBPut
            Effect: Allow
            Action:
              - dynamodb:PutItem
              - dynamodb:Query
            Resource:
              - !GetAtt AuthUserTable.Arn
              - !Sub "${AuthUserTable.Arn}/index/emailIndex"
          - Sid: AllowSESSendEmail
            Effect: Allow
            Action:
              - ses:SendEmail
              - ses:SendRawEmail
            Resource: "*"
      Roles:
        - !Ref AuthRegisterRole

  AuthSocialAuthRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        !Join [
          "-",
          [
            !Ref EnvironmentCode,
            !Ref AppName,
            "auth-social-auth",
            !Ref CountryCode,
            "role",
          ],
        ]
      Description: Role for Auth Social Auth Lambda
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action: sts:AssumeRole
      MaxSessionDuration: 3600
      Path: /

  AuthSocialAuthPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName:
        !Join [
          "-",
          [
            !Ref EnvironmentCode,
            !Ref AppName,
            "auth-social-auth",
            !Ref CountryCode,
            "policy",
          ],
        ]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowDDBQuery
            Effect: Allow
            Action:
              - dynamodb:Query
              - dynamodb:PutItem
            Resource:
              - !GetAtt AuthUserTable.Arn
              - !Sub "${AuthUserTable.Arn}/index/emailIndex"
      Roles:
        - !Ref AuthSocialAuthRole

  AuthForgotPasswordPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName:
        !Join [
          "-",
          [
            !Ref EnvironmentCode,
            !Ref AppName,
            "auth-forgot-password",
            !Ref CountryCode,
            "policy",
          ],
        ]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowDDBQueryUpdate
            Effect: Allow
            Action:
              - dynamodb:Query
              - dynamodb:UpdateItem
            Resource:
              - !GetAtt AuthUserTable.Arn
              - !Sub "${AuthUserTable.Arn}/index/emailIndex"
      Roles:
        - !Ref AuthForgotPasswordRole
  TrialRequestsPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName:
        !Join [
          "-",
          [
            !Ref EnvironmentCode,
            !Ref AppName,
            "trial-requests",
            !Ref CountryCode,
            "policy",
          ],
        ]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:PutItem
            Resource: !GetAtt TrialRequestsTable.Arn
          - Effect: Allow
            Action:
              - sns:Publish
            Resource: !Ref TrialRequestsNotificationTopic
      Roles:
        - !Ref TrialRequestsRole

  # ========================== ROLES ================================
  AuthLoginRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        !Join [
          "-",
          [
            !Ref EnvironmentCode,
            !Ref AppName,
            "auth-login",
            !Ref CountryCode,
            "role",
          ],
        ]
      Description: Role for Auth Login Lambda
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action: sts:AssumeRole
      MaxSessionDuration: 3600
      Path: /

  AuthRegisterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        !Join [
          "-",
          [
            !Ref EnvironmentCode,
            !Ref AppName,
            "auth-register",
            !Ref CountryCode,
            "role",
          ],
        ]
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: [lambda.amazonaws.com]
            Action: sts:AssumeRole
      Path: /

  AuthForgotPasswordRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        !Join [
          "-",
          [
            !Ref EnvironmentCode,
            !Ref AppName,
            "auth-forgot-password",
            !Ref CountryCode,
            "role",
          ],
        ]
      Description: Role for Auth Forgot Password Lambda
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action: sts:AssumeRole
      MaxSessionDuration: 3600
      Path: /
  TrialRequestsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        !Join [
          "-",
          [
            !Ref EnvironmentCode,
            !Ref AppName,
            "trial-requests",
            !Ref CountryCode,
            "role",
          ],
        ]
      Description: Role for Lambda trial-requests only
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action: sts:AssumeRole
      MaxSessionDuration: 3600
      Path: /

  # ========================== TEACHERS & REGISTRATIONS ROLES ================================
  GetTeachersRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        !Join [
          "-",
          [
            !Ref EnvironmentCode,
            !Ref AppName,
            "get-teachers",
            !Ref CountryCode,
            "role",
          ],
        ]
      Description: Role for Get Teachers Lambda
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action: sts:AssumeRole
      MaxSessionDuration: 3600
      Path: /

  GetTeachersPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName:
        !Join [
          "-",
          [
            !Ref EnvironmentCode,
            !Ref AppName,
            "get-teachers",
            !Ref CountryCode,
            "policy",
          ],
        ]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:Scan
            Resource: !GetAtt TeachersTable.Arn
          - Effect: Allow
            Action:
              - dynamodb:GetItem
            Resource: !GetAtt AuthUserTable.Arn
      Roles:
        - !Ref GetTeachersRole

  GetTeacherByIdRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        !Join [
          "-",
          [
            !Ref EnvironmentCode,
            !Ref AppName,
            "get-teacher-by-id",
            !Ref CountryCode,
            "role",
          ],
        ]
      Description: Role for Get Teacher By ID Lambda
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action: sts:AssumeRole
      MaxSessionDuration: 3600
      Path: /

  GetTeacherByIdPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName:
        !Join [
          "-",
          [
            !Ref EnvironmentCode,
            !Ref AppName,
            "get-teacher-by-id",
            !Ref CountryCode,
            "policy",
          ],
        ]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:GetItem
            Resource: !GetAtt TeachersTable.Arn
      Roles:
        - !Ref GetTeacherByIdRole

  GetAvailableSlotsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        !Join [
          "-",
          [
            !Ref EnvironmentCode,
            !Ref AppName,
            "get-available-slots",
            !Ref CountryCode,
            "role",
          ],
        ]
      Description: Role for Get Available Slots Lambda
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action: sts:AssumeRole
      MaxSessionDuration: 3600
      Path: /

  GetAvailableSlotsPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName:
        !Join [
          "-",
          [
            !Ref EnvironmentCode,
            !Ref AppName,
            "get-available-slots",
            !Ref CountryCode,
            "policy",
          ],
        ]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:GetItem
            Resource: !GetAtt TeachersTable.Arn
          - Effect: Allow
            Action:
              - dynamodb:Query
            Resource:
              - !GetAtt RegistrationsTable.Arn
              - !Sub "${RegistrationsTable.Arn}/index/teacherDateIndex"
      Roles:
        - !Ref GetAvailableSlotsRole

  CreateRegistrationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        !Join [
          "-",
          [
            !Ref EnvironmentCode,
            !Ref AppName,
            "create-registration",
            !Ref CountryCode,
            "role",
          ],
        ]
      Description: Role for Create Registration Lambda
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action: sts:AssumeRole
      MaxSessionDuration: 3600
      Path: /

  CreateRegistrationPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName:
        !Join [
          "-",
          [
            !Ref EnvironmentCode,
            !Ref AppName,
            "create-registration",
            !Ref CountryCode,
            "policy",
          ],
        ]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:GetItem
            Resource: !GetAtt TeachersTable.Arn
          - Effect: Allow
            Action:
              - dynamodb:Query
            Resource:
              - !GetAtt AuthUserTable.Arn
              - !Sub "${AuthUserTable.Arn}/index/emailIndex"
              - !GetAtt RegistrationsTable.Arn
              - !Sub "${RegistrationsTable.Arn}/index/userDateIndex"
              - !Sub "${RegistrationsTable.Arn}/index/teacherDateIndex"
          - Effect: Allow
            Action:
              - dynamodb:PutItem
              - dynamodb:UpdateItem
            Resource: !GetAtt RegistrationsTable.Arn
      Roles:
        - !Ref CreateRegistrationRole

  GetRegistrationsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        !Join [
          "-",
          [
            !Ref EnvironmentCode,
            !Ref AppName,
            "get-registrations",
            !Ref CountryCode,
            "role",
          ],
        ]
      Description: Role for Get Registrations Lambda
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action: sts:AssumeRole
      MaxSessionDuration: 3600
      Path: /

  GetRegistrationsPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName:
        !Join [
          "-",
          [
            !Ref EnvironmentCode,
            !Ref AppName,
            "get-registrations",
            !Ref CountryCode,
            "policy",
          ],
        ]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:Query
            Resource:
              - !GetAtt RegistrationsTable.Arn
              - !Sub "${RegistrationsTable.Arn}/index/userDateIndex"
          - Effect: Allow
            Action:
              - dynamodb:GetItem
            Resource: !GetAtt TeachersTable.Arn
      Roles:
        - !Ref GetRegistrationsRole

  CancelSlotRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        !Join [
          "-",
          [
            !Ref EnvironmentCode,
            !Ref AppName,
            "cancel-slot",
            !Ref CountryCode,
            "role",
          ],
        ]
      Description: Role for Cancel Slot Lambda
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action: sts:AssumeRole
      MaxSessionDuration: 3600
      Path: /

  CancelSlotPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName:
        !Join [
          "-",
          [
            !Ref EnvironmentCode,
            !Ref AppName,
            "cancel-slot",
            !Ref CountryCode,
            "policy",
          ],
        ]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
            Resource: !GetAtt RegistrationsTable.Arn
      Roles:
        - !Ref CancelSlotRole

  ToggleFavoriteRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        !Join [
          "-",
          [
            !Ref EnvironmentCode,
            !Ref AppName,
            "toggle-favorite",
            !Ref CountryCode,
            "role",
          ],
        ]
      Description: Role for Toggle Favorite Lambda
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action: sts:AssumeRole
      MaxSessionDuration: 3600
      Path: /

  ToggleFavoritePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName:
        !Join [
          "-",
          [
            !Ref EnvironmentCode,
            !Ref AppName,
            "toggle-favorite",
            !Ref CountryCode,
            "policy",
          ],
        ]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:UpdateItem
              - dynamodb:GetItem
            Resource: !GetAtt AuthUserTable.Arn
          - Effect: Allow
            Action:
              - dynamodb:GetItem
            Resource: !GetAtt TeachersTable.Arn
      Roles:
        - !Ref ToggleFavoriteRole

  GetFavoritesRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        !Join [
          "-",
          [
            !Ref EnvironmentCode,
            !Ref AppName,
            "get-favorites",
            !Ref CountryCode,
            "role",
          ],
        ]
      Description: Role for Get Favorites Lambda
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action: sts:AssumeRole
      MaxSessionDuration: 3600
      Path: /

  GetFavoritesPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName:
        !Join [
          "-",
          [
            !Ref EnvironmentCode,
            !Ref AppName,
            "get-favorites",
            !Ref CountryCode,
            "policy",
          ],
        ]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:GetItem
            Resource: !GetAtt AuthUserTable.Arn
          - Effect: Allow
            Action:
              - dynamodb:GetItem
            Resource: !GetAtt TeachersTable.Arn
      Roles:
        - !Ref GetFavoritesRole

  # ========================== Lambda Layers ================================
  SharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName:
        !Join [
          "-",
          [
            !Ref EnvironmentCode,
            !Ref AppName,
            "shared-layer",
            !Ref CountryCode,
          ],
        ]
      Description: Dependencies for NexgenSpeak Backend Service.
      ContentUri: ../src/layers/
      CompatibleRuntimes: ["nodejs20.x"]
      LicenseInfo: "MIT"
      RetentionPolicy: Retain
  # ========================== LAMBDA =======================================
  AuthLoginLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        !Join [
          "-",
          [!Ref EnvironmentCode, !Ref AppName, "auth-login", !Ref CountryCode],
        ]
      CodeUri: ../src/lambdas/auth/login
      Role: !GetAtt AuthLoginRole.Arn
      Handler: app.lambdaHandler
      MemorySize: 256
      Timeout: 600
      Runtime: nodejs20.x
      Tracing: Active
      Layers:
        - !Ref SharedLayer
      Environment:
        Variables:
          AWS: True
          JWT_SECRET: !Ref JwtSecret
          USERS_TABLE: !Ref AuthUserTable

  AuthRegisterLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        !Join [
          "-",
          [
            !Ref EnvironmentCode,
            !Ref AppName,
            "auth-register",
            !Ref CountryCode,
          ],
        ]
      CodeUri: ../src/lambdas/auth/register
      Handler: app.lambdaHandler
      Runtime: nodejs20.x
      MemorySize: 256
      Timeout: 600
      Tracing: Active
      Role: !GetAtt AuthRegisterRole.Arn
      Layers:
        - !Ref SharedLayer
      Environment:
        Variables:
          AWS: True
          JWT_SECRET: !Ref JwtSecret
          USERS_TABLE: !Ref AuthUserTable

  AuthSocialAuthLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        !Join [
          "-",
          [
            !Ref EnvironmentCode,
            !Ref AppName,
            "auth-social-auth",
            !Ref CountryCode,
          ],
        ]
      CodeUri: ../src/lambdas/auth/social-auth
      Handler: app.lambdaHandler
      Runtime: nodejs20.x
      MemorySize: 256
      Timeout: 600
      Tracing: Active
      Role: !GetAtt AuthSocialAuthRole.Arn
      Layers:
        - !Ref SharedLayer
      Environment:
        Variables:
          AWS: True
          JWT_SECRET: !Ref JwtSecret
          USERS_TABLE: !Ref AuthUserTable

  AuthForgotPasswordLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        !Join [
          "-",
          [
            !Ref EnvironmentCode,
            !Ref AppName,
            "auth-forgot-password",
            !Ref CountryCode,
          ],
        ]
      CodeUri: ../src/lambdas/auth/forgot-password
