  # ========================== DynamoDB =====================================
  AuthUserTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:
        !Join ["-", [!Ref AWS::StackName, "auth-user", !Ref CountryCode]]
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: !If [ConditionUseProd, true, false]
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: emailIndex
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL
  TrialRequestsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:
        !Join ["-", [!Ref AWS::StackName, "trial-requests", !Ref CountryCode]]
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: !If [ConditionUseProd, true, false]
      AttributeDefinitions:
        - AttributeName: requestId
          AttributeType: S
        - AttributeName: email
          AttributeType: S
        - AttributeName: phone
          AttributeType: S
      KeySchema:
        - AttributeName: requestId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: emailIndex
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: phoneIndex
          KeySchema:
            - AttributeName: phone
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  TeachersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:
        !Join ["-", [!Ref AWS::StackName, "teachers", !Ref CountryCode]]
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: !If [ConditionUseProd, true, false]
      AttributeDefinitions:
        - AttributeName: teacherId
          AttributeType: S
      KeySchema:
        - AttributeName: teacherId
          KeyType: HASH

  RegistrationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:
        !Join ["-", [!Ref AWS::StackName, "registrations", !Ref CountryCode]]
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: !If [ConditionUseProd, true, false]
      AttributeDefinitions:
        - AttributeName: registrationId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
        - AttributeName: teacherId
          AttributeType: S
        - AttributeName: date
          AttributeType: S
      KeySchema:
        - AttributeName: registrationId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: userDateIndex
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: date
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: teacherDateIndex
          KeySchema:
            - AttributeName: teacherId
              KeyType: HASH
            - AttributeName: date
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

Outputs:
  # ========================== API GATEWAY OUTPUTS ================================
  ApiGatewayUrl:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${EnvironmentCode}"
    Export:
      Name: !Sub "${AWS::StackName}-ApiGatewayUrl"

  ApiGatewayId:
    Description: "API Gateway ID"
    Value: !Ref ApiGateway
    Export:
      Name: !Sub "${AWS::StackName}-ApiGatewayId"

  # ========================== LAMBDA OUTPUTS ================================
  AuthLoginLambdaArn:
    Description: "Auth Login Lambda ARN"
    Value: !GetAtt AuthLoginLambda.Arn
    Export:
      Name: !Sub "${AWS::StackName}-AuthLoginLambdaArn"

  AuthRegisterLambdaArn:
    Description: "Auth Register Lambda ARN"
    Value: !GetAtt AuthRegisterLambda.Arn
    Export:
      Name: !Sub "${AWS::StackName}-AuthRegisterLambdaArn"

  AuthSocialAuthLambdaArn:
    Description: "Auth Social Auth Lambda ARN"
    Value: !GetAtt AuthSocialAuthLambda.Arn
    Export:
      Name: !Sub "${AWS::StackName}-AuthSocialAuthLambdaArn"

  AuthForgotPasswordLambdaArn:
    Description: "Auth Forgot Password Lambda ARN"
    Value: !GetAtt AuthForgotPasswordLambda.Arn
    Export:
      Name: !Sub "${AWS::StackName}-AuthForgotPasswordLambdaArn"
  TrialRequestsLambdaArn:
    Description: "Trial Requests Lambda ARN"
    Value: !GetAtt TrialRequestsLambda.Arn
    Export:
      Name: !Sub "${AWS::StackName}-TrialRequestsLambdaArn"
  # ========================== DYNAMODB OUTPUTS ================================
  AuthUserTableName:
    Description: "Auth User Table Name"
    Value: !Ref AuthUserTable
    Export:
      Name: !Sub "${AWS::StackName}-AuthUserTableName"
  TrialRequestsTableName:
    Description: "Trial Requests Table Name"
    Value: !Ref TrialRequestsTable
    Export:
      Name: !Sub "${AWS::StackName}-TrialRequestsTableName"

  # ========================== SNS OUTPUTS ================================
  TrialRequestsNotificationTopicArn:
    Description: "Trial Requests Notification Topic ARN"
    Value: !Ref TrialRequestsNotificationTopic
    Export:
      Name: !Sub "${AWS::StackName}-TrialRequestsNotificationTopicArn"
